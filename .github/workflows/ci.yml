name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · ruff, mypy, migrations, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finscope
          POSTGRES_PASSWORD: finscope
          POSTGRES_DB: finscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finscope"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finscope:finscope@localhost:5432/finscope
      REDIS_URL: redis://localhost:6379/0
      API_KEY: ci-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: Seed demo data (twice, to prove idempotency)
        run: |
          python scripts/seed_demo.py
          python scripts/seed_demo.py

  api-image:
    name: API · Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fin-scope-api:ci apps/api

  web:
    name: Web · lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Placeholder: route handlers need a backend URL at build time; no
      # request is made during the build.
      API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # After the build: Next generates route types (e.g. LayoutProps) there.
      - name: Type-check
        run: npx tsc --noEmit
